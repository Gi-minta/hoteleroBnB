name: Deploy client to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "client/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# Permisos mínimos que necesita el despliegue de Pages vía OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; no cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fuerza la fuente de Pages a "GitHub Actions" (build_type=workflow) desde
      # el propio workflow, usando el GITHUB_TOKEN. Sin esto, si el repo tenía
      # Pages en modo "Deploy from a branch", el build legacy de la raíz compite
      # con este deploy y gana a veces, sirviendo un 404. No es fatal si falla.
      - name: Ensure Pages is served from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${{ github.repository }}/pages"
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" -d '{"build_type":"workflow"}')
          echo "PUT /pages -> HTTP $code"; cat /tmp/pages.json 2>/dev/null || true
          if [ "$code" = "404" ] || [ "$code" = "422" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" -d '{"build_type":"workflow"}')
            echo "POST /pages -> HTTP $code"; cat /tmp/pages.json 2>/dev/null || true
          fi

      # Habilita Pages (idempotente) y expone la configuración a pasos siguientes.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # Fallback SPA para GitHub Pages: sin 404.html, recargar una ruta profunda
      # como /hoteleroBnB/admin devuelve 404. .nojekyll evita que Pages ignore
      # archivos que empiezan con "_".
      - name: SPA fallback + disable Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
